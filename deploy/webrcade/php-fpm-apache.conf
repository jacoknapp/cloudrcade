# Terminate HTTP/2 in the application server, with PHP handled over local FastCGI.
Protocols h2 http/1.1
H2Push Off
<FilesMatch "\.php$">
    SetHandler "proxy:fcgi://127.0.0.1:9000"
</FilesMatch>
# Preserve the Authorization header for PHP endpoints, including aliased paths.
SetEnvIfNoCase ^Authorization$ "(.+)" HTTP_AUTHORIZATION=$1
