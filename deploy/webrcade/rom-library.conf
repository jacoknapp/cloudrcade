# Open the maintained collection by default. Preserve the upstream application.
AliasMatch "^/$" "/var/www/touch/cloud/launch.php"
AliasMatch "^/play/default-feed\.json$" "/var/www/touch/cloud/launch.php"
# Locally patched player content changes independently of the upstream filename.
<LocationMatch "^/play/static/js/main\.[a-f0-9]+\.chunk\.js$">
    Header set Cache-Control "no-cache"
</LocationMatch>
Alias /content/feeds/ "${WEBRCADE_STATE_PATH}/feeds/"
<Directory "${WEBRCADE_STATE_PATH}/feeds">
    Require all granted
    Options -Indexes
    Header set Cache-Control "no-cache"
</Directory>
# Identity-dependent runtime config and login/session responses must not be cached.
<LocationMatch "^/cloud-saves/(api|config|launch|3ds-keys|core-crash-log)\.php$">
    Header unset Cache-Control
    Header always set Cache-Control "no-store"
</LocationMatch>
# Disc streaming in webRcade requires a Content-Type response header.
AddType application/octet-stream .chd .pbp .bin .nes .sfc .smc .gba .gb .gbc .nds .n64 .z64 .v64 .smd .gen

# Keep generated and managed data outside the read-only NAS mount.
Alias /content/derived/ /var/www/html/derived/
Alias /content/managed/ /var/www/html/managed/

# Mobile controller assets and patched HTML; original emulator bundles stay intact.
Alias /touch-controls/ /var/www/touch/assets/
# Safari also probes these conventional paths outside the page's JS context.
AliasMatch "^/apple-touch-icon(?:-precomposed)?\.png$" "/var/www/touch/assets/cloudrcade-180.png"
AliasMatch "^/favicon\.ico$" "/var/www/touch/assets/cloudrcade.ico"
<Location /touch-controls/offline-worker.js>
    Header set Service-Worker-Allowed "/"
</Location>
Alias /cloud-saves/ /var/www/touch/cloud/
Alias /arcade-bundles/ /var/www/touch/pages/app/
AliasMatch "^/play/(index\.html)?$" "/var/www/touch/pages/index.html"
AliasMatch "^/play/app/([a-z0-9-]+)/(index\.html)?$" "/var/www/touch/pages/app/$1/index.html"
# Locally built console apps. Must follow the AliasMatch above, which serves
# their overlaid entry points; everything else comes from the build output.
Alias /play/app/retro-azahar/ /var/www/touch/apps/retro-azahar/
Alias /play/app/retro-ppsspp/ /var/www/touch/apps/retro-ppsspp/
AddType application/octet-stream .iso .cso .elf
# Streaming and the library need a Content-Type for 3DS games as well.
AddType application/octet-stream .cia .3ds .cci .cxi
<Directory /var/www/touch>
    Require all granted
    Header set Cache-Control "no-cache"
    # Preserve /play/.htaccess isolation for threaded cores (e.g. Nintendo DS).
    Header set Cross-Origin-Opener-Policy "same-origin"
    Header set Cross-Origin-Embedder-Policy "require-corp"
</Directory>

# Runtime key responses always stay private, even when a parent enables ROM CORS.
<Location /cloud-saves/3ds-keys.php>
    Header always unset Access-Control-Allow-Origin
    Header always set Cross-Origin-Resource-Policy "same-origin"
</Location>
# BIOS directories may sit in the ROM share. Key files must never use static
# ROM serving/caching; only the fixed runtime endpoint above may read them.
<FilesMatch "(?i)^(aes_keys\.txt|keys\.txt|keys\.bin|default_keys\.h|boot9\.bin|boot11\.bin|otp\.bin|movable\.sed)$">
    Require all denied
</FilesMatch>
