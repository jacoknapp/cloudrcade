name: Docker release
on:
  push:
    branches: [master, beta/psp-core]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source and synthetic regression tests
        run: |
          sudo apt-get update
          sudo apt-get install -y php-cli php-curl rsync
          python3 scripts/check-release.py
          python3 scripts/test.py
      - name: Prepare experimental GameCube and corresponding source
        if: github.ref == 'refs/heads/beta/psp-core'
        run: python3 deploy/webrcade/retro-dolphin/prepare.py
      - name: Prepare key-free 3DS app and corresponding source
        run: python3 scripts/prepare-core.py
      - name: Build PSP app and corresponding source
        run: bash deploy/webrcade/retro-ppsspp/build.sh
      - uses: docker/setup-qemu-action@v3
        if: github.ref != 'refs/heads/beta/psp-core'
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Select image tags
        id: tags
        env:
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          COMMIT: ${{ github.sha }}
        run: |
          image="ghcr.io/${REPOSITORY,,}"
          echo "web=$image:sha-$COMMIT" >> "$GITHUB_OUTPUT"
          if [ "$REF_NAME" = master ]; then tag=latest; elif [ "$REF_NAME" = beta/psp-core ]; then tag=beta-psp-core; elif [ "$REF_TYPE" = tag ]; then tag="$REF_NAME"; else tag="pr-test"; fi
          echo "web_alias=$image:$tag" >> "$GITHUB_OUTPUT"
          if [ "$REF_NAME" = beta/psp-core ]; then platforms=linux/amd64; else platforms=linux/amd64,linux/arm64; fi
          echo "platforms=$platforms" >> "$GITHUB_OUTPUT"
      - name: Build AMD64 app image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ github.ref == 'refs/heads/beta/psp-core' && 'web-gamecube' || 'web' }}
          platforms: linux/amd64
          load: true
          tags: cloudrcade:test
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Verify AMD64 app and scheduled feed builder
        run: python3 scripts/smoke-image.py cloudrcade:test linux/amd64 ${{ github.ref == 'refs/heads/beta/psp-core' && '--gamecube' || '' }}
      - name: Build ARM64 app image
        if: github.ref != 'refs/heads/beta/psp-core'
        uses: docker/build-push-action@v6
        with:
          context: .
          target: web
          platforms: linux/arm64
          load: true
          tags: cloudrcade:test-arm64
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Verify ARM64 app and scheduled feed builder under QEMU
        if: github.ref != 'refs/heads/beta/psp-core'
        run: python3 scripts/smoke-image.py cloudrcade:test-arm64 linux/arm64
      - name: Publish verified app images
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ github.ref == 'refs/heads/beta/psp-core' && 'web-gamecube' || 'web' }}
          platforms: ${{ steps.tags.outputs.platforms }}
          push: true
          tags: |
            ${{ steps.tags.outputs.web }}
            ${{ steps.tags.outputs.web_alias }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
          provenance: true
          sbom: true
