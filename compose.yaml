# CloudRcade deployment. Copy .env.example to .env before starting.
services:
  webrcade:
    image: ${WEBRCADE_IMAGE:-ghcr.io/jacoknapp/cloudrcade:latest}
    env_file: ${WEBRCADE_ENV_FILE:-.env}
    ports:
      - "${WEBRCADE_BIND_ADDRESS:-127.0.0.1}:${WEBRCADE_HTTPS_PORT:-8443}:443"
    volumes:
      - type: bind
        source: ${WEBRCADE_HOST_PATH:-./config}
        target: /config
      - type: bind
        source: ${WEBRCADE_ROM_PATH:-./roms}
        target: /roms
        read_only: true
    restart: unless-stopped
